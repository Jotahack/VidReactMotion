name: Validate VidReactMotion

on:
  push:
    branches:
      - feat/modular-local-mvp
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and syntax checks
        run: npm run check
      - name: Compile React and Tailwind preview
        run: npm run build
